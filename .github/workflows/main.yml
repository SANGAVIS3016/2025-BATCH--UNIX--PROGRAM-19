name: Crontab Autograding

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout student submission
        uses: actions/checkout@v4

      - name: Install cron utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y cron

      - name: Prepare scripts
        run: |
          chmod +x starter/cron_job.sh
          chmod +x starter/setup_cron.sh
          chmod +x tests/test_crontab.sh

      - name: Display repository structure
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f -print

      - name: Run autograding tests
        run: |
          bash tests/test_crontab.sh
